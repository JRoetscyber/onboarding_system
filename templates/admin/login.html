{% extends "base.html" %}
{% block body %}
<main class="login-page">
  <form method="post" class="login-panel">
    <h1>Admin login</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    <label class="form-label">Password</label>
    <input class="form-control" type="password" name="password" required autofocus>
    <button class="btn btn-dark w-100 mt-3">Login</button>
  </form>
</main>
{% endblock %}
